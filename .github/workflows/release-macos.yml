name: Build and Publish macOS Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create or update (for example v1.2.3)'
        required: true
      release_name:
        description: 'Release title'
        required: false
      release_body:
        description: 'Release notes / description'
        required: false
      prerelease:
        description: 'Create a prerelease?'
        required: false
        default: 'false'

jobs:
  build_and_publish:
    name: Build macOS Release
    runs-on: [self-hosted, linux]
    container:
      image: ivangabriele/tauri:debian-bullseye-18
      options: --security-opt seccomp=unconfined

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS package
        run: pnpm build:macos

      - name: Locate release asset
        id: asset
        run: |
          set -e
          artifact=$(find ./src-tauri/target/release/bundle -maxdepth 2 -type f \( -name '*.dmg' -o -name '*.app.zip' -o -name '*.app' \) | head -n 1)
          if [ -z "$artifact" ]; then
            echo 'No release artifact found in src-tauri/target/release/bundle'
            exit 1
          fi
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "asset_name=$(basename "$artifact")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: ${{ github.event.inputs.release_name || github.event.inputs.release_tag }}
          body: ${{ github.event.inputs.release_body }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset
        uses: softprops/action-upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.asset.outputs.artifact }}
          asset_name: ${{ steps.asset.outputs.asset_name }}
