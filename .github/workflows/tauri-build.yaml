name: Tauri CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04

    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image and run lint/build checks inside it
        run: |
          docker build -t colima-manager-ci .
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace colima-manager-ci /bin/bash -lc "pnpm install --frozen-lockfile && pnpm lint:check && pnpm build && cd src-tauri && cargo fmt --all --check && cargo clippy --all-targets --all-features -- -D warnings && cargo check --all-targets --all-features"